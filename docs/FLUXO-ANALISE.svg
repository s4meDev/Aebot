<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">Etapas da análise do AEBOT</title><desc id="flow-desc">Consulta explica sem ocorrência; hipótese fica isolada. Relato passa por fatos, contexto, condições e exceções. Falta de informação gera pergunta. Todas as regras aplicáveis são combinadas antes da resposta.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#163b81"/></marker></defs><style>rect{fill:#fff;stroke:#163b81;stroke-width:1.4}text{font:14px Segoe UI, sans-serif;fill:#13264c}path[marker-end]{stroke:#163b81;stroke-width:1.5}</style><path d="M480 71V105" fill="none" marker-end="url(#arrow)"/><path d="M330 133H310" fill="none" marker-end="url(#arrow)"/><path d="M630 133H650" fill="none" marker-end="url(#arrow)"/><path d="M480 161V215" fill="none" marker-end="url(#arrow)"/><path d="M800 161V243H630" fill="none" marker-end="url(#arrow)"/><path d="M480 271V315" fill="none" marker-end="url(#arrow)"/><path d="M630 343H650" fill="none" marker-end="url(#arrow)"/><path d="M800 315V243H630" fill="none" marker-end="url(#arrow)"/><path d="M480 371V415" fill="none" marker-end="url(#arrow)"/><path d="M480 471V515" fill="none" marker-end="url(#arrow)"/><path d="M330 543H310" fill="none" marker-end="url(#arrow)"/><path d="M480 571V615" fill="none" marker-end="url(#arrow)"/><path d="M480 671V715" fill="none" marker-end="url(#arrow)"/><path d="M480 771V815" fill="none" marker-end="url(#arrow)"/><path d="M160 161V215" fill="none" marker-end="url(#arrow)"/><path d="M160 271V315" fill="none" marker-end="url(#arrow)"/><path d="M160 371V415" fill="none" marker-end="url(#arrow)"/><path d="M10 443H5V243H10" fill="none" marker-end="url(#arrow)"/><path d="M310 343H320V843H330" fill="none" marker-end="url(#arrow)"/><path d="M160 571V843H330" fill="none" marker-end="url(#arrow)"/><g id="flow-entry"><rect x="330" y="15" width="300" height="56" rx="8"/><text x="480" y="47" text-anchor="middle">Serviço selecionado + mensagem atual</text></g><g id="flow-intent"><rect x="330" y="105" width="300" height="56" rx="8"/><text x="480" y="137" text-anchor="middle">Consulta, hipótese ou relato real?</text></g><g id="flow-consult"><rect x="10" y="105" width="300" height="56" rx="8"/><text x="160" y="137" text-anchor="middle">Consulta: explicar sem confirmar fato</text></g><g id="flow-topics"><rect x="10" y="215" width="300" height="56" rx="8"/><text x="160" y="247" text-anchor="middle">Recuperar todos os assuntos da consulta</text></g><g id="flow-unknown"><rect x="10" y="315" width="300" height="56" rx="8"/><text x="160" y="347" text-anchor="middle">Outro assunto ainda está ambíguo?</text></g><g id="flow-clarify"><rect x="10" y="415" width="300" height="56" rx="8"/><text x="160" y="447" text-anchor="middle">Orientar o conhecido e pedir o outro ponto</text></g><g id="flow-scenario"><rect x="650" y="105" width="300" height="56" rx="8"/><text x="800" y="137" text-anchor="middle">Hipótese: isolar da OS real</text></g><g id="flow-facts"><rect x="330" y="215" width="300" height="56" rx="8"/><text x="480" y="247" text-anchor="middle">Fatos, citações, negação e etapas</text></g><g id="flow-context"><rect x="330" y="315" width="300" height="56" rx="8"/><text x="480" y="347" text-anchor="middle">Escopo e contexto suficientemente claros?</text></g><g id="flow-ask"><rect x="650" y="315" width="300" height="56" rx="8"/><text x="800" y="347" text-anchor="middle">Perguntar só o detalhe necessário</text></g><g id="flow-guards"><rect x="330" y="415" width="300" height="56" rx="8"/><text x="480" y="447" text-anchor="middle">Conferir condições e exceções</text></g><g id="flow-applicable"><rect x="330" y="515" width="300" height="56" rx="8"/><text x="480" y="547" text-anchor="middle">Há classificatórias aplicáveis?</text></g><g id="flow-partial"><rect x="10" y="515" width="300" height="56" rx="8"/><text x="160" y="547" text-anchor="middle">Orientar sem conclusão oficial</text></g><g id="flow-combine"><rect x="330" y="615" width="300" height="56" rx="8"/><text x="480" y="647" text-anchor="middle">Combinar TODOS os fatos confirmados</text></g><g id="flow-resolve"><rect x="330" y="715" width="300" height="56" rx="8"/><text x="480" y="747" text-anchor="middle">Resolver conflitos pela política do serviço</text></g><g id="flow-answer"><rect x="330" y="815" width="300" height="56" rx="8"/><text x="480" y="847" text-anchor="middle">Resposta curta + todos os fundamentos</text></g><text x="320" y="123" text-anchor="end">Consulta</text><text x="640" y="123">Hipótese</text><text x="490" y="195">OS real</text><text x="635" y="333">Não</text><text x="490" y="401">Sim</text><text x="320" y="505" text-anchor="end">Não</text><text x="490" y="602">Sim</text><text x="660" y="204">Esclarecimento / retificação</text><text x="170" y="401">Sim</text><text x="315" y="330" text-anchor="end">Não</text></svg>